[project]
name = "cohortworld-delta"
version = "0.1.0"
description = "T2 on CohortWorld own cohorts: is one edge distinguishable from noise, and which way"
requires-python = ">=3.12"
dependencies = ["verifiers==0.3.1", "cohortworld-env"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cohortworld_delta"]
