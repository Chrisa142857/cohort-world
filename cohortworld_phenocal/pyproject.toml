[project]
name = "cohortworld-phenocal"
version = "0.1.0"
description = "PhenoCal questions answered inside CohortWorld: the public, k-anonymous task layer"
requires-python = ">=3.12"
dependencies = ["verifiers==0.3.1", "cohortworld-env"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cohortworld_phenocal"]
