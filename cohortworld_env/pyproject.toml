[project]
name = "cohortworld-env"
version = "0.1.0"
description = "CohortWorld: disease-incidence prediction, cohort location, and reachable-minimum search over a k-anonymous UK Biobank cohort lattice"
requires-python = ">=3.12"
dependencies = ["verifiers==0.3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cohortworld_env"]
