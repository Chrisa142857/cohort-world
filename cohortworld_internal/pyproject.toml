[project]
name = "cohortworld-internal"
version = "0.1.0"
description = "T3 on CohortWorld's own cohorts: the internal half, where the five axes are complete"
requires-python = ">=3.12"
dependencies = ["verifiers==0.3.1", "cohortworld-env"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cohortworld_internal"]
