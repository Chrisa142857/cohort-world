# Cold start for Qwen3.6-27B, the 27B arm of the CS-GRPO comparison.
#
# Byte-identical to the 9B cold start except for the model, the run name and the GPU count. The same
# 1,753 demonstrations, the same 72 steps, the same batch, sequence length, learning rate and seed, so
# the two arms differ in the model and in nothing else. Qwen3.6-27B reports `model_type` qwen3_5, the
# same class the trainer and the renderer already handle, so neither needed a change.
#
# world_size is 8 rather than 4 because the weights and the optimiser state of a 27B do not fit on
# four cards at this sequence length. batch_size 48 stays divisible by it, 48/8 = 6 micro-steps.
# SFT: carve <cohort-think> into the model's own predictions from PHYSICIAN REASONING, not from
# CohortWorld episodes.
#
# What differs from episode-level demonstrations, and why it matters for what the model learns:
#   * episode-level samples are whole tool-calling episodes (user / assistant / tool / assistant / ...),
#     so the model imitates a trajectory: which move id to call, in which order. That is the part the
#     verifier and the tool schema can teach at RL time, and it is the part that does not transfer.
#   * here a sample is ONE assistant turn: <cohort-think>five sentences of clinical reasoning, ending in
#     "Adjustment: -0.0434."</cohort-think>. No move ids, no tool names, no environment. The reference
#     group is named in words ("people who share the rest of this history but for whom medication for
#     infections is not required"), which is the action's parameters stated as a clinician states them.
#   * the demonstrations come from the edge table's own action parameters and deltas
#     (official/CohortWorld_pooled_edges.jsonl) plus the environment's generalising
#     move, so every one of them is a move the agent can actually take.
#
# The tag is part of the ANSWER. A mask check rendered a sample through prime-rl's
# own renderer and showed 199 of 382 tokens carry loss, the trained span running from <cohort-think> to
# </cohort-think><|im_end|>, the user turn masked -- and showed the check can fail, by moving the tag into
# the user turn and watching it go untrained.
max_steps = 72          # 1,753 train samples at batch_size 48 is 36 steps per epoch, so this is exactly two

[run]
name = "sft_qwen3.6-27b_cohort-think"

[model]
name = "Qwen/Qwen3.6-27B"  # HF revision 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9

[renderer]
name = "qwen3.5"
enable_thinking = false

[data]
type = "sft"
name = "data/sft/cohort_think"  # the cold-start demonstrations, built by build/make_cohort_think_demos.py; not in the public dataset, available on request
splits = ["train"]
seed = 42
batch_size = 48         # world_size 8 x micro_batch 1 must divide it: 48/8 = 6 micro-steps per rank
micro_batch_size = 1
seq_len = 1024          # rendered samples: median 303 tokens, p95 361, p99 427, max 486 (500-sample probe).
                        # episode-level demonstrations needed 6144 because a sample was a whole episode; a single reasoning turn is
                        # an order of magnitude shorter, and a seq_len below the max would truncate the
                        # CLOSING tag off the longest samples -- the one token the model must learn to emit
                        # to end its reasoning.

[optim]
lr = 1e-5

[ckpt]
interval = 72          # one checkpoint, at the end: a 27B checkpoint is ~300 GB and took ~15 min to write; interval 10 would have spent 1.5 h of a 1.2 h run writing
keep_last = 5

[deployment]
num_train_gpus = 8
num_infer_gpus = 0

[val]
interval = 10

[val.data]
type = "sft"
name = "data/sft/cohort_think"  # the cold-start demonstrations, built by build/make_cohort_think_demos.py; not in the public dataset, available on request
splits = ["validation"]
batch_size = 24
micro_batch_size = 1
seq_len = 1024
